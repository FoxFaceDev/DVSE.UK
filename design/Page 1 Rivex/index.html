<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0a3bb8">
  <title>RIVEX.UK – Drive Your Future</title>
  <meta name="description" content="Learn. Practise. Drive with confidence. Theory test practice and approved driving instructors near you.">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Hero ===== -->
  <header class="hero">
    <img class="hero__photo" src="img/hero-photo.jpg" alt="" width="1200" height="830" fetchpriority="high">

    <div class="hero__inner">
      <span class="hero__grid" aria-hidden="true"></span>
      <a class="brand" href="./" aria-label="RIVEX.UK – Drive Your Future">
        <img class="brand__icon" src="img/logo-icon.png" alt="" width="830" height="696">
        <span class="brand__text">
          <span class="brand__name">RIVE<span class="brand__x">X</span><span class="brand__uk">.UK</span></span>
          <span class="brand__tagline">Drive your future</span>
        </span>
      </a>
    </div>

    <span class="hero__waves" aria-hidden="true"></span>
    <span class="hero__pills" aria-hidden="true">
      <span class="hero__pill hero__pill--blue"></span>
      <span class="hero__pill hero__pill--gold"></span>
    </span>
  </header>

  <!-- ===== Main ===== -->
  <main class="main">
    <section class="greeting" aria-labelledby="greeting-title">
      <h1 id="greeting-title" class="greeting__title">Hi <span class="greeting__name">Bryar,</span></h1>
      <p class="greeting__text">Learn. Practise. Drive with confidence.</p>
    </section>

    <div class="stage">
    <ul class="cards">
      <li>
        <a class="card card--blue" href="#theory-test">
          <img class="card__icon" src="img/icon-theory.svg" alt="" width="820" height="700">
          <span class="card__body"><span class="card__title">Theory Test</span></span>
        </a>
      </li>
      <li>
        <a class="card card--gold" href="#hazard-perception">
          <img class="card__icon" src="img/icon-hazard.svg" alt="" width="820" height="700">
          <span class="card__body"><span class="card__title">Hazard Perception</span></span>
        </a>
      </li>
      <li>
        <a class="card card--cyan" href="#highway-code">
          <img class="card__icon" src="img/icon-highway.svg" alt="" width="820" height="700">
          <span class="card__body"><span class="card__title">Highway Code</span></span>
        </a>
      </li>
      <li>
        <a class="card card--red" href="#road-signs">
          <img class="card__icon" src="img/icon-signs.svg" alt="" width="820" height="700">
          <span class="card__body"><span class="card__title">Road Signs</span></span>
        </a>
      </li>
      <li>
        <a class="card card--blue" href="#rivex-perks">
          <img class="card__icon" src="img/icon-perks.svg" alt="" width="820" height="700">
          <span class="card__body"><span class="card__title">RIVEX Perks</span></span>
        </a>
      </li>
    </ul>
    </div>
  </main>

  <!-- ===== Bottom navigation ===== -->
  <nav class="tabbar" aria-label="Main navigation">
    <ul class="tabbar__list">
      <li>
        <a class="tab tab--active" href="./" aria-current="page">
          <svg class="tab__icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 3.2 3.4 14.1c-.9.8-.4 2.3.8 2.3H6V26c0 1.1.9 2 2 2h4.6v-7h6.8v7H24c1.1 0 2-.9 2-2v-9.6h1.8c1.2 0 1.7-1.5.8-2.3z"/></svg>
          <span class="tab__label">Home</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#offers">
          <svg class="tab__icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="24" height="5.5" rx="1"/><path d="M6 16.5V28h20V16.5M16 11v17M16 11c-3 0-6.5-1-6.5-4a2.7 2.7 0 0 1 4.9-1.5C15.3 6.8 16 8.6 16 11zM16 11c3 0 6.5-1 6.5-4a2.7 2.7 0 0 0-4.9-1.5C16.7 6.8 16 8.6 16 11z"/></g></svg>
          <span class="tab__label">Offers</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#share">
          <svg class="tab__icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M19 5.5 28.5 14 19 22.5v-5.6C11.8 16.9 7.2 19.8 4 26.5c.9-8.6 5.6-14 15-14.8z"/></svg>
          <span class="tab__label">Share</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#profile">
          <svg class="tab__icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="12.6" r="4.4"/><path d="M7.6 24.6c2-3.4 5-5 8.4-5s6.4 1.6 8.4 5"/></g></svg>
          <span class="tab__label">Profile</span>
        </a>
      </li>
      <li>
        <a class="tab" href="#more">
          <svg class="tab__icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="currentColor"><circle cx="5.5" cy="16" r="3"/><circle cx="16" cy="16" r="3"/><circle cx="26.5" cy="16" r="3"/></g></svg>
          <span class="tab__label">More</span>
        </a>
      </li>
    </ul>
  </nav>

</body>
</html>
