<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Neon Responsive Navbar - DVSE.UK</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- فایلی ستایلی جیاواز -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar-container">
    <div class="neon-navbar">
      
      <!-- Left & Right Matrix Dot Patterns -->
      <div class="dots-pattern dots-left"></div>
      <div class="dots-pattern dots-right"></div>

      <!-- Navigation Content (Strictly Horizontal on All Devices) -->
      <nav class="nav-content">
        
        <!-- Item 1: About Us -->
        <a href="#about" class="nav-item">
          <div class="icon-wrapper">
            <svg class="ring-svg" viewBox="0 0 74 74">
              <defs>
                <filter id="neonBlueGlow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="2.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="neonGoldGlow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="2.5" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <linearGradient id="goldArcGrad" x1="0%" y1="0%" x2="100%" y2="80%">
                  <stop offset="0%" stop-color="#ffae00" />
                  <stop offset="50%" stop-color="#ffe600" />
                  <stop offset="100%" stop-color="#ff7b00" stop-opacity="0.1" />
                </linearGradient>
              </defs>

              <!-- Base Blue Ring -->
              <circle cx="37" cy="37" r="34" fill="none" stroke="#0077ff" stroke-width="2" filter="url(#neonBlueGlow)" />
              
              <!-- Soft Atmospheric Gold Glow Bloom -->
              <ellipse cx="58" cy="18" rx="10" ry="6" transform="rotate(25 58 18)" fill="#ffaa00" opacity="0.5" filter="blur(5px)" />
              
              <!-- Precise Glowing Gold Arc -->
              <path d="M 37,3 A 34,34 0 0,1 70,30" 
                    fill="none" 
                    stroke="url(#goldArcGrad)" 
                    stroke-width="2.4" 
                    stroke-linecap="round" 
                    filter="url(#neonGoldGlow)" />
            </svg>

            <!-- User Icon -->
            <svg class="inner-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>

          <div class="nav-label-box">
            <span class="nav-label">About Us</span>
            <div class="nav-underline"></div>
          </div>
        </a>

        <!-- Vertical Divider 1 -->
        <div class="divider-line"></div>

        <!-- Item 2: Contact Us -->
        <a href="#contact" class="nav-item">
          <div class="icon-wrapper">
            <svg class="ring-svg" viewBox="0 0 74 74">
              <!-- Base Blue Ring -->
              <circle cx="37" cy="37" r="34" fill="none" stroke="#0077ff" stroke-width="2" filter="url(#neonBlueGlow)" />
              
              <!-- Soft Atmospheric Gold Glow Bloom -->
              <ellipse cx="58" cy="18" rx="10" ry="6" transform="rotate(25 58 18)" fill="#ffaa00" opacity="0.5" filter="blur(5px)" />
              
              <!-- Precise Glowing Gold Arc -->
              <path d="M 37,3 A 34,34 0 0,1 70,30" 
                    fill="none" 
                    stroke="url(#goldArcGrad)" 
                    stroke-width="2.4" 
                    stroke-linecap="round" 
                    filter="url(#neonGoldGlow)" />
            </svg>

            <!-- Phone Icon -->
            <svg class="inner-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>

          <div class="nav-label-box">
            <span class="nav-label">Contact Us</span>
            <div class="nav-underline"></div>
          </div>
        </a>

        <!-- Vertical Divider 2 -->
        <div class="divider-line"></div>

        <!-- Item 3: Back to Home -->
        <a href="#home" class="nav-item">
          <div class="icon-wrapper">
            <svg class="ring-svg" viewBox="0 0 74 74">
              <!-- Base Blue Ring -->
              <circle cx="37" cy="37" r="34" fill="none" stroke="#0077ff" stroke-width="2" filter="url(#neonBlueGlow)" />
              
              <!-- Soft Atmospheric Gold Glow Bloom -->
              <ellipse cx="58" cy="18" rx="10" ry="6" transform="rotate(25 58 18)" fill="#ffaa00" opacity="0.5" filter="blur(5px)" />
              
              <!-- Precise Glowing Gold Arc -->
              <path d="M 37,3 A 34,34 0 0,1 70,30" 
                    fill="none" 
                    stroke="url(#goldArcGrad)" 
                    stroke-width="2.4" 
                    stroke-linecap="round" 
                    filter="url(#neonGoldGlow)" />
            </svg>

            <!-- Home Icon -->
            <svg class="inner-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>

          <div class="nav-label-box">
            <span class="nav-label">Back to Home</span>
            <div class="nav-underline"></div>
          </div>
        </a>

      </nav>

      <!-- Glowing Bottom Neon Line Path -->
      <div class="circuit-line-wrapper">
        <svg class="circuit-svg" viewBox="0 0 1000 30" fill="none" preserveAspectRatio="none">
          <defs>
            <linearGradient id="neonFluidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0044ff" stop-opacity="0" />
              <stop offset="10%" stop-color="#0066ff" />
              <stop offset="70%" stop-color="#0099ff" />
              <stop offset="82%" stop-color="#ffb700" />
              <stop offset="100%" stop-color="#ffb700" />
            </linearGradient>

            <filter id="circuitGlow" x="-20%" y="-50%" width="140%" height="200%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Stepped Neon Line -->
          <path d="M 20,22 L 725,22 C 755,22 770,8 805,8 L 980,8" 
                stroke="url(#neonFluidGrad)" 
                stroke-width="2.2" 
                filter="url(#circuitGlow)" />

          <!-- Blue Flare Dot -->
          <circle cx="215" cy="22" r="2" fill="#ffffff" filter="url(#circuitGlow)" />
          <circle cx="215" cy="22" r="4" fill="#00d4ff" opacity="0.8" filter="url(#circuitGlow)" />

          <!-- Yellow Corner Flare Dot -->
          <circle cx="805" cy="8" r="2.2" fill="#ffffff" filter="url(#circuitGlow)" />
          <circle cx="805" cy="8" r="4.5" fill="#ffb700" opacity="0.9" filter="url(#circuitGlow)" />
        </svg>
      </div>

      <!-- Bottom Copyright Badge -->
      <div class="footer-bar">
        <div class="copyright-badge">
          <span class="c-icon">C</span>
          <span>DVSE.UK</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
